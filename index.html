<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="_f12YcNoqWZpLu0Zi0bQYkS17WfOkKqlDwh_Ju_X2nk" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaS</title>

    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1e1e28;
            font-family: Arial, sans-serif;
            position: relative;
            user-select: none;
        }

        #counter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            color: rgba(255, 255, 255, 0.08);
            font-size: 35vw;
            font-weight: 900;
            pointer-events: none;
            line-height: 1;
        }
                
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        
        .game-character-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            z-index: 10;
            will-change: transform; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .game-character-item img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }

        .game-character-item:active {
            transform: translate(-50%, -50%) scale(0.85);
        }

        .character {
            position: absolute;
            cursor: grab;
            touch-action: none;
            z-index: 2;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .character:active {
            cursor: grabbing;
        }

        .character model-viewer {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .drag-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .bounce-impact {
            animation: impact 0.25s ease-out;
        }

        .popping-out {
            transform: scale(1.4) !important;
            opacity: 0 !important;
        }

        @keyframes impact {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

                
        #victory-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 15, 22, 0.92);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            overflow: hidden;
        }

        #victory-screen.active {
            opacity: 1;
            pointer-events: all;
        }

        .victory-ui-content {
            position: relative;
            z-index: 110; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: auto;
        }

        .victory-title {
            color: #ffffff;
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .victory-subtitle {
            color: #a0a0c0;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }


        .victory-char-item {
            position: absolute;
            width: 320px;
            height: 320px;
            z-index: 105;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }   

        .restart-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .restart-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.6);
        }

        .restart-btn:active {
            transform: translateY(1px) scale(0.98);
        }
    </style>
</head>
<body>
   <div id="counter">0</div>

        <div id="victory-screen">
            <div class="victory-ui-content">
                <button class="restart-btn" id="restart-btn">Otra vez?</button>
            </div>
        </div>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

    <script>
        
const winModelPool = [
            { 
                src: 'test2/scene.glb',  
                scale: 1.2, 
                offsetX: -20.0,
                animations: {
                    entry: 'Dive_Out',        
                    actionStart: 'DanceIn',  
                    actionLoop: 'DanceLoop'     
                }
            },
            { 
                src: 'test2/scene2.glb', 
                scale: 1.0, 
                offsetY: 10,
                animations: {
                    entry: 'Dive_Out',
                    actionStart: 'Dance_In',
                    actionLoop: 'Dance_Loop'
                }
            },
            { 
                src: 'test2/scene3.glb', 
                scale: 1.6, 
                offsetY: -5,
                animations: {
                    entry: 'Dive_Out',
                    actionStart: 'Dance_In',
                    actionLoop: 'Dance_Loop'
                }
            },
            { 
                src: 'test2/scene5.glb', 
                scale: 1.6, 
                offsetY: -5,
                animations: {
                    entry: 'Dive_Out',
                    actionStart: 'Dance_In',
                    actionLoop: 'Dance_Loop'
                }
            },
            { 
                src: 'test2/scene4.glb', 
                scale: 1.6, 
                offsetY: -5,
                animations: {
                    entry: 'Dive_Out',
                    actionStart: 'Dance_In',
                    actionLoop: 'Dance_Loop'
                }
            }
        ];

const victoryPositions = [
    { left: '50%', top: '80%' },
    { left: '18%', top: '30%' },
    { left: '82%', top: '30%' },
    { left: '18%', top: '70%' },
    { left: '82%', top: '70%' },
    { left: '50%', top: '22%' }
];

const isMobileDevice = () => window.innerWidth <= 768 || ('ontouchstart' in window);
const MAX_VICTORY_CHARS = isMobileDevice() ? 6 : 6;
const MAX_GAME_ITEMS = isMobileDevice() ? 500 : 8000; 
const SPAWN_EVERY_X_BOUNCES = 10;                 
const SPAWN_INTERVAL = 6000;


let score = 0;
let currentTarget = 500;
let isGameOver = false;

let victorySpawnTimer = null;
let victoryCharsCount = 0;


let physicsLoopId = null;
const activeGameItems = [];
const GRAVITY = 0.45;           
const BOUNCE_DAMPING = 0.88;     
const ITEM_RADIUS = 45;         

let draggedItem = null;
let lastPointerX = 0;
let lastPointerY = 0;


let gameContainer = null;
let victoryScreen = null;
let counterDisplay = null;
let restartBtn = null;



let victorySound = null;
let isAudioUnlocked = false;

function unlockAudioSystem() {
    if (isAudioUnlocked) return;

    const testAudio = new Audio('sas.mp3');
    testAudio.volume = 0.01;

    testAudio.play().then(() => {
        testAudio.pause();
        isAudioUnlocked = true;
    }).catch(() => {});

    document.removeEventListener('click', unlockAudioSystem);
    document.removeEventListener('touchstart', unlockAudioSystem);
    document.removeEventListener('keydown', unlockAudioSystem);
}

document.addEventListener('click', unlockAudioSystem);
document.addEventListener('touchstart', unlockAudioSystem);
document.addEventListener('keydown', unlockAudioSystem);

function playPopSound(pitch = 1.0) {
    try {
        const pop = new Audio('pop.mp3');
        pop.volume = 0.6;
        pop.playbackRate = pitch;
        pop.play().catch(() => {});
    } catch (e) {}
}

function playVictorySound() {
    try {
        if (victorySound) {
            victorySound.pause();
            victorySound.currentTime = 0;
        }

        victorySound = new Audio('sas.mp3');
        victorySound.volume = 0.1;
        victorySound.play().catch((err) => console.log("Error al reproducir victoria:", err));
    } catch (e) {}
}

function stopVictorySound() {
    if (victorySound) {
        victorySound.pause();
        victorySound.currentTime = 0;
        victorySound = null;
    }
}



function addPointAndCheckWin() {
    if (isGameOver) return;

    score++;
    if (counterDisplay) counterDisplay.textContent = score;

    
    if (score % SPAWN_EVERY_X_BOUNCES === 0 && activeGameItems.length < MAX_GAME_ITEMS) {
        spawnCharacter();
    }

    // Condición de victoria
    if (score >= currentTarget) {
        isGameOver = true;
        handleWinSequence();
    }
}


function handleCircleCollisions() {
    const minDistance = ITEM_RADIUS * 2;

    for (let i = 0; i < activeGameItems.length; i++) {
        for (let j = i + 1; j < activeGameItems.length; j++) {
            const item1 = activeGameItems[i];
            const item2 = activeGameItems[j];

            const dx = item2.x - item1.x;
            const dy = item2.y - item1.y;
            const distance = Math.hypot(dx, dy);

            if (distance < minDistance && distance > 0) {
                const nx = dx / distance;
                const ny = dy / distance;

                const overlap = minDistance - distance;
                if (!item1.isDragging && !item2.isDragging) {
                    item1.x -= nx * (overlap / 2);
                    item1.y -= ny * (overlap / 2);
                    item2.x += nx * (overlap / 2);
                    item2.y += ny * (overlap / 2);
                } else if (item1.isDragging) {
                    item2.x += nx * overlap;
                    item2.y += ny * overlap;
                } else {
                    item1.x -= nx * overlap;
                    item1.y -= ny * overlap;
                }

                const kx = item1.vx - item2.vx;
                const ky = item1.vy - item2.vy;
                const p = 2 * (nx * kx + ny * ky) / 2;

                if (nx * kx + ny * ky > 0) {
                    if (!item1.isDragging) {
                        item1.vx -= p * nx * BOUNCE_DAMPING;
                        item1.vy -= p * ny * BOUNCE_DAMPING;
                    }
                    if (!item2.isDragging) {
                        item2.vx += p * nx * BOUNCE_DAMPING;
                        item2.vy += p * ny * BOUNCE_DAMPING;
                    }

                    addPointAndCheckWin();
                }
            }
        }
    }
}

function updatePhysics() {
    if (isGameOver) return;

    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    handleCircleCollisions();

    for (let i = 0; i < activeGameItems.length; i++) {
        const item = activeGameItems[i];

        if (item.isDragging) continue;

        item.vy += GRAVITY;
        item.x += item.vx;
        item.y += item.vy;

        let bounced = false;

        // Rebote Borde Derecho
        if (item.x + ITEM_RADIUS >= screenWidth) {
            item.x = screenWidth - ITEM_RADIUS;
            item.vx = -item.vx * BOUNCE_DAMPING;
            bounced = true;
        }
        // Rebote Borde Izquierdo
        else if (item.x - ITEM_RADIUS <= 0) {
            item.x = ITEM_RADIUS;
            item.vx = -item.vx * BOUNCE_DAMPING;
            bounced = true;
        }

        // Rebote Suelo
        if (item.y + ITEM_RADIUS >= screenHeight) {
            item.y = screenHeight - ITEM_RADIUS;
            item.vy = -item.vy * BOUNCE_DAMPING;
            item.vx *= 0.96;
            bounced = true;
        }
        // Rebote Techo
        else if (item.y - ITEM_RADIUS <= 0) {
            item.y = ITEM_RADIUS;
            item.vy = -item.vy * BOUNCE_DAMPING;
            bounced = true;
        }

        if (bounced && (Math.abs(item.vx) > 0.8 || Math.abs(item.vy) > 0.8)) {
            addPointAndCheckWin();
        }

        item.element.style.transform = `translate3d(${item.x - ITEM_RADIUS}px, ${item.y - ITEM_RADIUS}px, 0px)`;
    }

    physicsLoopId = requestAnimationFrame(updatePhysics);
}



function spawnCharacter() {
    if (isGameOver || !gameContainer) return;

    const charDiv = document.createElement('div');
    charDiv.className = 'game-character-item';
    charDiv.innerHTML = `<img src="imagenes/2.png" alt="Personaje" draggable="false">`;

    const startX = Math.random() * (window.innerWidth - 180) + 90;
    const startY = 120;

    const itemData = {
        element: charDiv,
        x: startX,
        y: startY,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 4,
        isDragging: false
    };

    charDiv.addEventListener('pointerdown', (e) => {
        if (isGameOver) return;
        e.preventDefault();

        itemData.isDragging = true;
        draggedItem = itemData;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        itemData.vx = 0;
        itemData.vy = 0;

        charDiv.style.cursor = 'grabbing';
    });

    gameContainer.appendChild(charDiv);
    activeGameItems.push(itemData);

   
    playPopSound(1.0 + Math.min(activeGameItems.length * 0.1, 0.4));
}

window.addEventListener('pointermove', (e) => {
    if (!draggedItem || isGameOver) return;

    const deltaX = e.clientX - lastPointerX;
    const deltaY = e.clientY - lastPointerY;

    draggedItem.x = e.clientX;
    draggedItem.y = e.clientY;

    draggedItem.vx = deltaX * 0.85;
    draggedItem.vy = deltaY * 0.85;

    lastPointerX = e.clientX;
    lastPointerY = e.clientY;

    draggedItem.element.style.transform = `translate3d(${draggedItem.x - ITEM_RADIUS}px, ${draggedItem.y - ITEM_RADIUS}px, 0px)`;
});

window.addEventListener('pointerup', () => {
    if (draggedItem) {
        draggedItem.isDragging = false;
        draggedItem.element.style.cursor = 'grab';
        draggedItem = null;
    }
});



function handleWinSequence() {
    
    if (physicsLoopId) cancelAnimationFrame(physicsLoopId);
    if (draggedItem) {
        draggedItem.isDragging = false;
        draggedItem = null;
    }

    let delay = 250; 
    let pitchStep = 1.0;

    function removeNextItem() {
        if (activeGameItems.length > 0) {
            
            const item = activeGameItems.pop();
            if (item && item.element) {
                item.element.remove();
            }

            
            playPopSound(pitchStep);
            pitchStep += 0.12;

            
            delay = Math.max(50, delay * 0.72);

            setTimeout(removeNextItem, delay);
        } else {
            
            setTimeout(() => {
                showVictoryScreen();
            }, 150);
        }
    }

    
    setTimeout(removeNextItem, 200);
}

function playVictoryAnimationSequence(viewer, anims, skipEntry = false) {
    if (!anims) return;

    const { entry, actionStart, actionLoop } = anims;
    const crossfadeTime = 0.4;

    function playClip(clipName, onComplete) {
        if (!clipName) {
            if (onComplete) onComplete();
            return;
        }

        viewer.animationName = clipName;
        let isTransitioning = false;

        function checkFrame() {
            if (isTransitioning) return;

            const duration = viewer.duration || 0;
            const currentTime = viewer.currentTime || 0;

            if (duration > 0 && currentTime >= Math.max(0, duration - crossfadeTime)) {
                isTransitioning = true;
                if (onComplete) onComplete();
            } else {
                requestAnimationFrame(checkFrame);
            }
        }

        setTimeout(() => {
            requestAnimationFrame(checkFrame);
        }, 60);
    }

    if (skipEntry) {
        playClip(actionStart, () => {
            if (actionLoop) viewer.animationName = actionLoop;
        });
    } else { 
        playClip(entry, () => {
            playClip(actionStart, () => {
                if (actionLoop) viewer.animationName = actionLoop;
            });
        });
    }
}

function spawnVictoryCharacter(index) {
    if (!victoryScreen) return;

    const winModel = winModelPool[Math.floor(Math.random() * winModelPool.length)];
    const pos = victoryPositions[index % victoryPositions.length];

    const charDiv = document.createElement('div');
    charDiv.className = 'victory-char-item';
    charDiv.style.left = pos.left;
    charDiv.style.top = pos.top;

    const isMain = (index === 0);
    const shadowAttr = isMain ? 'shadow-intensity="1" shadow-softness="0.8"' : 'shadow-intensity="0"';
    const controlsAttr = isMain ? 'camera-controls auto-rotate' : '';
    const renderScaleAttr = isMain ? 'render-scale="1"' : 'render-scale="0.75"';

    charDiv.innerHTML = `
        <model-viewer 
            src="${winModel.src}"
            autoplay
            animation-crossfade-duration="400"
            interaction-prompt="none"
            power-preference="high-performance"
            ${shadowAttr}
            ${controlsAttr}
            ${renderScaleAttr}
            style="width: 100%; height: 100%; transform: translateY(${winModel.offsetY}px);">
        </model-viewer>
    `;

    victoryScreen.appendChild(charDiv);

    const viewer = charDiv.querySelector('model-viewer');
    viewer.addEventListener('load', () => {
        const skipEntry = !isMain;
        playVictoryAnimationSequence(viewer, winModel.animations, skipEntry);
    });

    playPopSound(1.0 + (index * 0.15));
}

function showVictoryScreen() {
    if (victorySpawnTimer) clearInterval(victorySpawnTimer);

    // Reproducir música/sonido de victoria
    playVictorySound();

    if (victoryScreen) victoryScreen.classList.add('active');

    victoryCharsCount = 0;

    spawnVictoryCharacter(0);
    victoryCharsCount++;

    victorySpawnTimer = setInterval(() => {
        if (victoryCharsCount < MAX_VICTORY_CHARS) {
            spawnVictoryCharacter(victoryCharsCount);
            victoryCharsCount++;
        } else {
            clearInterval(victorySpawnTimer);
        }
    }, SPAWN_INTERVAL);
}



function resetGame() {
    stopVictorySound();

    if (physicsLoopId) cancelAnimationFrame(physicsLoopId);
    if (victorySpawnTimer) clearInterval(victorySpawnTimer);

    if (victoryScreen) {
        const victoryChars = victoryScreen.querySelectorAll('.victory-char-item');
        victoryChars.forEach(el => el.remove());
        victoryScreen.classList.remove('active');
    }

    activeGameItems.forEach(item => item.element.remove());
    activeGameItems.length = 0;

    score = 0;
    isGameOver = false;

    if (counterDisplay) counterDisplay.textContent = '0';

    spawnCharacter();
    physicsLoopId = requestAnimationFrame(updatePhysics);
}

document.addEventListener('DOMContentLoaded', () => {
    gameContainer = document.getElementById('game-container') || document.body;
    victoryScreen = document.getElementById('victory-screen');
    counterDisplay = document.getElementById('counter');
    restartBtn = document.getElementById('restart-btn');

    if (restartBtn) {
        restartBtn.addEventListener('click', resetGame);
    }

    resetGame();
});
    </script>
</body>
